<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TaskFlow — Get Things Done</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:ital,wght@0,300;0,400;1,300&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a0f;
    --surface: #111118;
    --surface2: #18181f;
    --surface3: #22222c;
    --border: rgba(255,255,255,0.07);
    --border-bright: rgba(255,255,255,0.15);
    --text: #f0eee8;
    --text-muted: #7a7a8a;
    --text-dim: #4a4a5a;
    --accent: #c8f542;
    --accent-dim: rgba(200,245,66,0.12);
    --accent-glow: rgba(200,245,66,0.25);
    --red: #ff5e5e;
    --red-dim: rgba(255,94,94,0.12);
    --blue: #5eb8ff;
    --blue-dim: rgba(94,184,255,0.12);
    --purple: #b57bff;
    --purple-dim: rgba(181,123,255,0.12);
    --orange: #ffac5e;
    --orange-dim: rgba(255,172,94,0.12);
    --radius: 12px;
    --radius-sm: 8px;
    --transition: 0.2s cubic-bezier(0.4,0,0.2,1);
  }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'Syne', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── SCROLLBAR ── */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--surface3); border-radius: 2px; }

  /* ── AUTH SCREEN ── */
  #auth-screen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }

  .auth-bg {
    position: fixed; inset: 0; z-index: 0;
    background:
      radial-gradient(ellipse 60% 50% at 20% 80%, rgba(200,245,66,0.06) 0%, transparent 70%),
      radial-gradient(ellipse 50% 40% at 80% 20%, rgba(94,184,255,0.05) 0%, transparent 60%),
      var(--bg);
  }

  .auth-grid {
    position: fixed; inset: 0; z-index: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
    background-size: 48px 48px;
  }

  .auth-card {
    position: relative; z-index: 1;
    width: 420px;
    max-width: calc(100vw - 32px);
    background: var(--surface);
    border: 1px solid var(--border-bright);
    border-radius: 20px;
    padding: 48px 40px;
    box-shadow: 0 40px 80px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.03);
    animation: fadeUp 0.6s cubic-bezier(0.4,0,0.2,1) both;
  }

  @keyframes fadeUp {
    from { opacity:0; transform: translateY(24px); }
    to   { opacity:1; transform: translateY(0); }
  }

  .auth-logo {
    font-size: 28px; font-weight: 800;
    letter-spacing: -1px;
    margin-bottom: 4px;
    display: flex; align-items: center; gap: 10px;
  }

  .auth-logo span.dot {
    display: inline-block;
    width: 10px; height: 10px;
    background: var(--accent);
    border-radius: 50%;
    box-shadow: 0 0 12px var(--accent-glow);
  }

  .auth-tagline {
    font-family: 'Instrument Serif', serif;
    font-style: italic;
    font-size: 15px;
    color: var(--text-muted);
    margin-bottom: 36px;
  }

  .tab-row {
    display: flex; gap: 4px;
    background: var(--surface2);
    border-radius: var(--radius-sm);
    padding: 4px;
    margin-bottom: 28px;
  }

  .tab-btn {
    flex: 1; padding: 9px;
    font-family: 'Syne', sans-serif;
    font-size: 13px; font-weight: 600;
    border: none; border-radius: 6px;
    cursor: pointer;
    transition: var(--transition);
    background: transparent;
    color: var(--text-muted);
  }

  .tab-btn.active {
    background: var(--accent);
    color: #0a0a0f;
  }

  .form-group { margin-bottom: 16px; }

  .form-group label {
    display: block;
    font-size: 11px; font-weight: 700;
    letter-spacing: 1.5px; text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 8px;
  }

  .form-group input {
    width: 100%;
    padding: 12px 14px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 14px;
    transition: var(--transition);
    outline: none;
  }

  .form-group input:focus {
    border-color: var(--accent);
    background: var(--surface3);
    box-shadow: 0 0 0 3px var(--accent-dim);
  }

  .form-group input::placeholder { color: var(--text-dim); }

  .btn-primary {
    width: 100%; padding: 14px;
    background: var(--accent);
    color: #0a0a0f;
    border: none; border-radius: var(--radius-sm);
    font-family: 'Syne', sans-serif;
    font-size: 14px; font-weight: 800;
    letter-spacing: 0.5px;
    cursor: pointer;
    transition: var(--transition);
    margin-top: 4px;
  }

  .btn-primary:hover {
    background: #d8ff55;
    transform: translateY(-1px);
    box-shadow: 0 8px 24px var(--accent-glow);
  }

  .btn-primary:active { transform: translateY(0); }

  .auth-error {
    background: var(--red-dim);
    border: 1px solid rgba(255,94,94,0.2);
    border-radius: var(--radius-sm);
    color: var(--red);
    font-size: 13px;
    padding: 10px 12px;
    margin-bottom: 16px;
    display: none;
  }

  .demo-hint {
    text-align: center;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 20px;
  }

  .demo-hint strong { color: var(--text-muted); }

  /* ── APP LAYOUT ── */
  #app-screen { display: none; min-height: 100vh; }

  .app-bg {
    position: fixed; inset: 0; z-index: -1;
    background:
      radial-gradient(ellipse 40% 30% at 5% 5%, rgba(200,245,66,0.04) 0%, transparent 60%),
      radial-gradient(ellipse 30% 40% at 95% 95%, rgba(94,184,255,0.03) 0%, transparent 60%),
      var(--bg);
  }

  /* ── HEADER ── */
  .header {
    position: sticky; top: 0; z-index: 100;
    background: rgba(10,10,15,0.85);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
    padding: 0 24px;
    height: 64px;
    display: flex; align-items: center; justify-content: space-between;
  }

  .header-logo {
    font-size: 20px; font-weight: 800;
    letter-spacing: -0.5px;
    display: flex; align-items: center; gap: 8px;
  }

  .header-logo .dot {
    width: 8px; height: 8px;
    background: var(--accent);
    border-radius: 50%;
    box-shadow: 0 0 8px var(--accent-glow);
  }

  .header-right { display: flex; align-items: center; gap: 12px; }

  .user-chip {
    display: flex; align-items: center; gap: 8px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 40px;
    padding: 6px 14px 6px 6px;
    font-size: 13px; font-weight: 600;
  }

  .user-avatar {
    width: 28px; height: 28px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), #80cc00);
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 800; color: #0a0a0f;
  }

  .btn-logout {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text-muted);
    padding: 7px 12px;
    font-family: 'Syne', sans-serif;
    font-size: 12px; font-weight: 600;
    cursor: pointer;
    transition: var(--transition);
  }

  .btn-logout:hover { border-color: var(--red); color: var(--red); }

  /* ── MAIN CONTAINER ── */
  .main { max-width: 1200px; margin: 0 auto; padding: 32px 24px; }

  /* ── STATS ROW ── */
  .stats-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    margin-bottom: 32px;
  }

  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    position: relative;
    overflow: hidden;
    transition: var(--transition);
  }

  .stat-card::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0;
    height: 2px;
    background: var(--accent-color, var(--accent));
  }

  .stat-card:hover { border-color: var(--border-bright); transform: translateY(-2px); }

  .stat-label {
    font-size: 10px; font-weight: 700;
    letter-spacing: 2px; text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 8px;
  }

  .stat-value {
    font-size: 36px; font-weight: 800;
    letter-spacing: -2px;
    line-height: 1;
  }

  .stat-sub {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 6px;
  }

  /* ── TOOLBAR ── */
  .toolbar {
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }

  .search-wrap {
    flex: 1; min-width: 200px;
    position: relative;
  }

  .search-icon {
    position: absolute; left: 12px; top: 50%;
    transform: translateY(-50%);
    color: var(--text-dim);
    font-size: 14px;
  }

  .search-input {
    width: 100%;
    padding: 10px 14px 10px 36px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    outline: none;
    transition: var(--transition);
  }

  .search-input:focus { border-color: var(--accent); background: var(--surface2); }
  .search-input::placeholder { color: var(--text-dim); }

  .filter-btn {
    padding: 9px 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text-muted);
    font-family: 'Syne', sans-serif;
    font-size: 12px; font-weight: 600;
    cursor: pointer;
    transition: var(--transition);
    white-space: nowrap;
  }

  .filter-btn:hover, .filter-btn.active {
    background: var(--accent-dim);
    border-color: var(--accent);
    color: var(--accent);
  }

  .btn-new-task {
    display: flex; align-items: center; gap: 6px;
    padding: 10px 20px;
    background: var(--accent);
    color: #0a0a0f;
    border: none; border-radius: var(--radius-sm);
    font-family: 'Syne', sans-serif;
    font-size: 13px; font-weight: 800;
    cursor: pointer;
    transition: var(--transition);
    white-space: nowrap;
  }

  .btn-new-task:hover {
    background: #d8ff55;
    transform: translateY(-1px);
    box-shadow: 0 6px 20px var(--accent-glow);
  }

  /* ── KANBAN BOARD ── */
  .board {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
  }

  .column {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }

  .col-header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
  }

  .col-title {
    display: flex; align-items: center; gap: 10px;
    font-size: 13px; font-weight: 700;
    letter-spacing: 0.5px;
  }

  .col-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
  }

  .col-count {
    background: var(--surface3);
    border-radius: 20px;
    padding: 2px 8px;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
  }

  .col-body {
    padding: 12px;
    min-height: 200px;
    display: flex; flex-direction: column; gap: 10px;
  }

  /* ── TASK CARD ── */
  .task-card {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 14px 16px;
    cursor: pointer;
    transition: var(--transition);
    position: relative;
    overflow: hidden;
    animation: slideIn 0.3s cubic-bezier(0.4,0,0.2,1) both;
  }

  @keyframes slideIn {
    from { opacity:0; transform: translateY(-8px); }
    to   { opacity:1; transform: translateY(0); }
  }

  .task-card:hover {
    border-color: var(--border-bright);
    background: var(--surface3);
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(0,0,0,0.3);
  }

  .task-card::before {
    content: '';
    position: absolute; left: 0; top: 0; bottom: 0;
    width: 3px;
    background: var(--priority-color, var(--text-dim));
    border-radius: 0;
  }

  .task-title {
    font-size: 14px; font-weight: 700;
    margin-bottom: 6px;
    line-height: 1.3;
    padding-left: 10px;
  }

  .task-desc {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
    line-height: 1.5;
    margin-bottom: 10px;
    padding-left: 10px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .task-meta {
    display: flex; align-items: center; gap: 6px;
    padding-left: 10px;
    flex-wrap: wrap;
  }

  .tag {
    font-size: 10px; font-weight: 700;
    letter-spacing: 0.8px; text-transform: uppercase;
    padding: 2px 7px; border-radius: 4px;
  }

  .tag-priority-high   { background: var(--red-dim);    color: var(--red); }
  .tag-priority-medium { background: var(--orange-dim); color: var(--orange); }
  .tag-priority-low    { background: var(--blue-dim);   color: var(--blue); }

  .task-due {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: var(--text-dim);
    margin-left: auto;
  }

  .task-due.overdue { color: var(--red); }

  .task-actions {
    display: none;
    position: absolute; top: 10px; right: 10px;
    gap: 4px;
  }

  .task-card:hover .task-actions { display: flex; }

  .icon-btn {
    width: 26px; height: 26px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--surface);
    cursor: pointer;
    font-size: 12px;
    transition: var(--transition);
  }

  .icon-btn:hover.edit { border-color: var(--blue); background: var(--blue-dim); }
  .icon-btn:hover.delete { border-color: var(--red); background: var(--red-dim); }

  .empty-col {
    text-align: center;
    padding: 32px 16px;
    color: var(--text-dim);
    font-size: 12px;
    font-family: 'DM Mono', monospace;
  }

  .empty-col .empty-icon { font-size: 28px; margin-bottom: 8px; opacity: 0.3; }

  /* ── LIST VIEW ── */
  #list-view { display: none; }

  .task-list { display: flex; flex-direction: column; gap: 8px; }

  .task-row {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 14px 20px;
    display: flex; align-items: center; gap: 16px;
    cursor: pointer;
    transition: var(--transition);
    animation: slideIn 0.3s both;
  }

  .task-row:hover { border-color: var(--border-bright); background: var(--surface2); }

  .task-row-check {
    width: 18px; height: 18px;
    border-radius: 50%;
    border: 2px solid var(--text-dim);
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 10px;
    transition: var(--transition);
    cursor: pointer;
  }

  .task-row-check.done {
    background: var(--accent);
    border-color: var(--accent);
    color: #0a0a0f;
  }

  .task-row-title { flex: 1; font-size: 14px; font-weight: 600; }
  .task-row-title.done-text { text-decoration: line-through; color: var(--text-muted); }

  .task-row-badge {
    font-size: 10px; font-weight: 700;
    padding: 3px 8px; border-radius: 4px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }

  .badge-todo     { background: var(--surface3); color: var(--text-muted); }
  .badge-progress { background: var(--purple-dim); color: var(--purple); }
  .badge-done     { background: var(--accent-dim); color: var(--accent); }

  .task-row-actions { display: flex; gap: 6px; opacity: 0; transition: var(--transition); }
  .task-row:hover .task-row-actions { opacity: 1; }

  /* ── MODAL ── */
  .modal-overlay {
    position: fixed; inset: 0; z-index: 200;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(8px);
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
    opacity: 0; pointer-events: none;
    transition: opacity 0.25s ease;
  }

  .modal-overlay.open { opacity: 1; pointer-events: all; }

  .modal {
    width: 520px;
    max-width: 100%;
    max-height: 90vh;
    overflow-y: auto;
    background: var(--surface);
    border: 1px solid var(--border-bright);
    border-radius: 20px;
    padding: 32px;
    box-shadow: 0 40px 80px rgba(0,0,0,0.7);
    transform: scale(0.95) translateY(10px);
    transition: transform 0.25s cubic-bezier(0.4,0,0.2,1);
  }

  .modal-overlay.open .modal { transform: scale(1) translateY(0); }

  .modal-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 28px;
  }

  .modal-title {
    font-size: 20px; font-weight: 800; letter-spacing: -0.5px;
  }

  .modal-close {
    width: 32px; height: 32px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 16px;
    transition: var(--transition);
  }

  .modal-close:hover { border-color: var(--red); color: var(--red); }

  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

  .form-group select, .form-group textarea {
    width: 100%;
    padding: 12px 14px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    outline: none;
    transition: var(--transition);
  }

  .form-group select { cursor: pointer; }
  .form-group select option { background: var(--surface2); }

  .form-group textarea {
    resize: vertical;
    min-height: 80px;
  }

  .form-group select:focus, .form-group textarea:focus {
    border-color: var(--accent);
    background: var(--surface3);
    box-shadow: 0 0 0 3px var(--accent-dim);
  }

  .modal-actions { display: flex; gap: 10px; margin-top: 24px; }

  .btn-cancel {
    flex: 1; padding: 12px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text-muted);
    font-family: 'Syne', sans-serif;
    font-size: 13px; font-weight: 600;
    cursor: pointer;
    transition: var(--transition);
  }

  .btn-cancel:hover { border-color: var(--border-bright); color: var(--text); }

  .btn-save {
    flex: 2; padding: 12px;
    background: var(--accent);
    color: #0a0a0f;
    border: none; border-radius: var(--radius-sm);
    font-family: 'Syne', sans-serif;
    font-size: 13px; font-weight: 800;
    cursor: pointer;
    transition: var(--transition);
  }

  .btn-save:hover { background: #d8ff55; box-shadow: 0 4px 16px var(--accent-glow); }

  /* ── VIEW TOGGLE ── */
  .view-toggle {
    display: flex; gap: 4px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 4px;
  }

  .view-btn {
    padding: 7px 12px;
    border: none; border-radius: 5px;
    background: transparent;
    color: var(--text-muted);
    font-size: 14px; cursor: pointer;
    transition: var(--transition);
  }

  .view-btn.active { background: var(--surface3); color: var(--text); }

  /* ── TOAST ── */
  .toast-wrap {
    position: fixed; bottom: 24px; right: 24px;
    z-index: 300;
    display: flex; flex-direction: column; gap: 8px;
    pointer-events: none;
  }

  .toast {
    background: var(--surface2);
    border: 1px solid var(--border-bright);
    border-radius: var(--radius-sm);
    padding: 12px 16px;
    font-size: 13px; font-weight: 600;
    display: flex; align-items: center; gap: 8px;
    min-width: 240px;
    animation: toastIn 0.35s cubic-bezier(0.4,0,0.2,1) both;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  }

  @keyframes toastIn {
    from { opacity:0; transform: translateX(24px); }
    to   { opacity:1; transform: translateX(0); }
  }

  @keyframes toastOut {
    from { opacity:1; transform: translateX(0); }
    to   { opacity:0; transform: translateX(24px); }
  }

  .toast.out { animation: toastOut 0.3s forwards; }

  /* ── RESPONSIVE ── */
  @media (max-width: 900px) {
    .board { grid-template-columns: 1fr; }
    .stats-row { grid-template-columns: 1fr 1fr; }
  }

  @media (max-width: 600px) {
    .stats-row { grid-template-columns: 1fr 1fr; }
    .header { padding: 0 16px; }
    .main { padding: 20px 16px; }
    .form-row { grid-template-columns: 1fr; }
    .user-chip span.name { display: none; }
    .modal { padding: 24px 20px; }
    .auth-card { padding: 36px 24px; }
  }

  /* ── PROGRESS BAR ── */
  .progress-wrap { margin-top: 28px; margin-bottom: 32px; }

  .progress-label {
    display: flex; justify-content: space-between;
    font-size: 12px; font-weight: 600;
    color: var(--text-muted);
    margin-bottom: 8px;
  }

  .progress-bar-bg {
    height: 6px;
    background: var(--surface3);
    border-radius: 3px;
    overflow: hidden;
  }

  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), #80cc00);
    border-radius: 3px;
    transition: width 0.6s cubic-bezier(0.4,0,0.2,1);
    box-shadow: 0 0 8px var(--accent-glow);
  }

  /* ── SECTION HEADER ── */
  .section-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 20px;
  }

  .section-title {
    font-size: 18px; font-weight: 800;
    letter-spacing: -0.5px;
  }

  .section-sub {
    font-family: 'Instrument Serif', serif;
    font-style: italic;
    font-size: 14px;
    color: var(--text-muted);
  }

  .hidden { display: none !important; }
</style>
</head>
<body>

<!-- ═══ AUTH SCREEN ═══ -->
<div id="auth-screen">
  <div class="auth-bg"></div>
  <div class="auth-grid"></div>
  <div class="auth-card">
    <div class="auth-logo">TaskFlow <span class="dot"></span></div>
    <div class="auth-tagline">Organize your day, own your outcomes.</div>

    <div class="tab-row">
      <button class="tab-btn active" onclick="switchTab('login')">Sign In</button>
      <button class="tab-btn" onclick="switchTab('register')">Create Account</button>
    </div>

    <div id="auth-error" class="auth-error">Invalid credentials. Please try again.</div>

    <!-- Login -->
    <div id="login-form">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="login-email" placeholder="you@example.com" />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="login-pass" placeholder="••••••••" />
      </div>
      <button class="btn-primary" onclick="doLogin()">Sign In →</button>
    </div>

    <!-- Register -->
    <div id="register-form" style="display:none">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="reg-name" placeholder="Jane Smith" />
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="reg-email" placeholder="you@example.com" />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="reg-pass" placeholder="Min. 6 characters" />
      </div>
      <button class="btn-primary" onclick="doRegister()">Create Account →</button>
    </div>

    <div class="demo-hint">
      <strong>Demo:</strong> demo@taskflow.app / demo1234
    </div>
  </div>
</div>

<!-- ═══ APP SCREEN ═══ -->
<div id="app-screen">
  <div class="app-bg"></div>

  <!-- Header -->
  <header class="header">
    <div class="header-logo"><div class="dot"></div> TaskFlow</div>
    <div class="header-right">
      <div class="user-chip">
        <div class="user-avatar" id="user-avatar">JD</div>
        <span class="name" id="user-name-chip">Jane</span>
      </div>
      <button class="btn-logout" onclick="doLogout()">Sign Out</button>
    </div>
  </header>

  <!-- Main -->
  <main class="main">

    <!-- Stats -->
    <div class="stats-row">
      <div class="stat-card" style="--accent-color: var(--text-muted)">
        <div class="stat-label">Total Tasks</div>
        <div class="stat-value" id="stat-total">0</div>
        <div class="stat-sub">all time</div>
      </div>
      <div class="stat-card" style="--accent-color: var(--purple)">
        <div class="stat-label">In Progress</div>
        <div class="stat-value" id="stat-progress">0</div>
        <div class="stat-sub">active now</div>
      </div>
      <div class="stat-card" style="--accent-color: var(--accent)">
        <div class="stat-label">Completed</div>
        <div class="stat-value" id="stat-done">0</div>
        <div class="stat-sub">tasks finished</div>
      </div>
      <div class="stat-card" style="--accent-color: var(--red)">
        <div class="stat-label">Overdue</div>
        <div class="stat-value" id="stat-overdue">0</div>
        <div class="stat-sub">need attention</div>
      </div>
    </div>

    <!-- Progress -->
    <div class="progress-wrap">
      <div class="progress-label">
        <span>Overall Progress</span>
        <span id="progress-pct">0%</span>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progress-fill" style="width:0%"></div>
      </div>
    </div>

    <!-- Toolbar -->
    <div class="toolbar">
      <div class="search-wrap">
        <span class="search-icon">⌕</span>
        <input class="search-input" id="search-input" placeholder="Search tasks…" oninput="renderAll()" />
      </div>
      <button class="filter-btn active" onclick="setFilter('all', this)">All</button>
      <button class="filter-btn" onclick="setFilter('todo', this)">To Do</button>
      <button class="filter-btn" onclick="setFilter('in-progress', this)">In Progress</button>
      <button class="filter-btn" onclick="setFilter('done', this)">Done</button>
      <div class="view-toggle">
        <button class="view-btn active" id="board-btn" onclick="setView('board')" title="Board">⊞</button>
        <button class="view-btn" id="list-btn" onclick="setView('list')" title="List">☰</button>
      </div>
      <button class="btn-new-task" onclick="openModal()">+ New Task</button>
    </div>

    <!-- Board View -->
    <div id="board-view">
      <div class="board">
        <div class="column" id="col-todo">
          <div class="col-header">
            <div class="col-title"><div class="col-dot" style="background:#7a7a8a"></div> To Do</div>
            <span class="col-count" id="count-todo">0</span>
          </div>
          <div class="col-body" id="cards-todo"></div>
        </div>
        <div class="column" id="col-progress">
          <div class="col-header">
            <div class="col-title"><div class="col-dot" style="background:var(--purple)"></div> In Progress</div>
            <span class="col-count" id="count-progress">0</span>
          </div>
          <div class="col-body" id="cards-progress"></div>
        </div>
        <div class="column" id="col-done">
          <div class="col-header">
            <div class="col-title"><div class="col-dot" style="background:var(--accent)"></div> Done</div>
            <span class="col-count" id="count-done">0</span>
          </div>
          <div class="col-body" id="cards-done"></div>
        </div>
      </div>
    </div>

    <!-- List View -->
    <div id="list-view">
      <div class="task-list" id="list-container"></div>
    </div>

  </main>
</div>

<!-- ═══ MODAL ═══ -->
<div class="modal-overlay" id="modal-overlay" onclick="handleOverlayClick(event)">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="modal-title">New Task</div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>

    <div class="form-group">
      <label>Task Title *</label>
      <input type="text" id="task-title" placeholder="What needs to be done?" />
    </div>

    <div class="form-group">
      <label>Description</label>
      <textarea id="task-desc" placeholder="Add details, context, or notes…" rows="3"></textarea>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Status</label>
        <select id="task-status">
          <option value="todo">To Do</option>
          <option value="in-progress">In Progress</option>
          <option value="done">Done</option>
        </select>
      </div>
      <div class="form-group">
        <label>Priority</label>
        <select id="task-priority">
          <option value="low">Low</option>
          <option value="medium">Medium</option>
          <option value="high">High</option>
        </select>
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Category</label>
        <select id="task-category">
          <option value="General">General</option>
          <option value="Work">Work</option>
          <option value="Personal">Personal</option>
          <option value="Design">Design</option>
          <option value="Engineering">Engineering</option>
          <option value="Marketing">Marketing</option>
        </select>
      </div>
      <div class="form-group">
        <label>Due Date</label>
        <input type="date" id="task-due" />
      </div>
    </div>

    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-save" onclick="saveTask()">Save Task →</button>
    </div>
  </div>
</div>

<!-- ═══ TOASTS ═══ -->
<div class="toast-wrap" id="toast-wrap"></div>

<script>
// ══════════════════════════════════════
//  DATA & STATE
// ══════════════════════════════════════
const USERS_KEY  = 'tf_users';
const TASKS_KEY  = 'tf_tasks';
const SESS_KEY   = 'tf_session';

let currentUser = null;
let allTasks    = [];
let editingId   = null;
let viewMode    = 'board';
let filterMode  = 'all';

// Seed demo account
(function seedDemo() {
  const users = JSON.parse(localStorage.getItem(USERS_KEY) || '[]');
  if (!users.find(u => u.email === 'demo@taskflow.app')) {
    users.push({ name: 'Demo User', email: 'demo@taskflow.app', password: 'demo1234' });
    localStorage.setItem(USERS_KEY, JSON.stringify(users));
  }
  // Seed demo tasks if none
  const tasks = JSON.parse(localStorage.getItem(TASKS_KEY) || '[]');
  if (!tasks.find(t => t.owner === 'demo@taskflow.app')) {
    const demos = [
      { id: uid(), title: 'Review Q3 metrics', desc: 'Analyze traffic and conversion data for the quarter.', status: 'done', priority: 'high', category: 'Work', due: offset(-2), owner: 'demo@taskflow.app', created: Date.now() },
      { id: uid(), title: 'Design system audit', desc: 'Go through all components and flag inconsistencies.', status: 'in-progress', priority: 'medium', category: 'Design', due: offset(3), owner: 'demo@taskflow.app', created: Date.now() },
      { id: uid(), title: 'Refactor auth module', desc: 'Move to JWT-based sessions and add refresh tokens.', status: 'in-progress', priority: 'high', category: 'Engineering', due: offset(1), owner: 'demo@taskflow.app', created: Date.now() },
      { id: uid(), title: 'Write onboarding docs', desc: 'Create step-by-step setup guide for new devs.', status: 'todo', priority: 'low', category: 'Work', due: offset(7), owner: 'demo@taskflow.app', created: Date.now() },
      { id: uid(), title: 'Gym session', desc: 'Upper body focus. 45 minutes.', status: 'todo', priority: 'medium', category: 'Personal', due: offset(0), owner: 'demo@taskflow.app', created: Date.now() },
      { id: uid(), title: 'Pitch deck for Series A', desc: 'Finalize slides and investor narrative.', status: 'todo', priority: 'high', category: 'Marketing', due: offset(-1), owner: 'demo@taskflow.app', created: Date.now() },
    ];
    localStorage.setItem(TASKS_KEY, JSON.stringify([...tasks, ...demos]));
  }
})();

function uid() { return Math.random().toString(36).slice(2,10) + Date.now().toString(36); }
function offset(days) {
  const d = new Date(); d.setDate(d.getDate() + days);
  return d.toISOString().split('T')[0];
}

// ══════════════════════════════════════
//  AUTH
// ══════════════════════════════════════
function switchTab(tab) {
  document.querySelectorAll('.tab-btn').forEach((b,i) => b.classList.toggle('active', (tab==='login'?i===0:i===1)));
  document.getElementById('login-form').style.display    = tab==='login'    ? 'block' : 'none';
  document.getElementById('register-form').style.display = tab==='register' ? 'block' : 'none';
  hideAuthError();
}

function showAuthError(msg) {
  const el = document.getElementById('auth-error');
  el.textContent = msg; el.style.display = 'block';
}

function hideAuthError() { document.getElementById('auth-error').style.display = 'none'; }

function doLogin() {
  const email = document.getElementById('login-email').value.trim();
  const pass  = document.getElementById('login-pass').value;
  const users = JSON.parse(localStorage.getItem(USERS_KEY) || '[]');
  const user  = users.find(u => u.email === email && u.password === pass);
  if (!user) { showAuthError('Invalid credentials. Please try again.'); return; }
  sessionStorage.setItem(SESS_KEY, JSON.stringify(user));
  loadApp(user);
}

function doRegister() {
  const name  = document.getElementById('reg-name').value.trim();
  const email = document.getElementById('reg-email').value.trim();
  const pass  = document.getElementById('reg-pass').value;
  if (!name || !email || !pass) { showAuthError('All fields are required.'); return; }
  if (pass.length < 6) { showAuthError('Password must be at least 6 characters.'); return; }
  const users = JSON.parse(localStorage.getItem(USERS_KEY) || '[]');
  if (users.find(u => u.email === email)) { showAuthError('Account with this email already exists.'); return; }
  const user = { name, email, password: pass };
  users.push(user); localStorage.setItem(USERS_KEY, JSON.stringify(users));
  sessionStorage.setItem(SESS_KEY, JSON.stringify(user));
  loadApp(user);
}

function doLogout() {
  sessionStorage.removeItem(SESS_KEY);
  currentUser = null;
  document.getElementById('app-screen').style.display = 'none';
  document.getElementById('auth-screen').style.display = 'flex';
  showToast('Signed out successfully', '👋');
}

// ══════════════════════════════════════
//  APP INIT
// ══════════════════════════════════════
window.addEventListener('DOMContentLoaded', () => {
  const sess = sessionStorage.getItem(SESS_KEY);
  if (sess) { loadApp(JSON.parse(sess)); }
});

function loadApp(user) {
  currentUser = user;
  document.getElementById('auth-screen').style.display = 'none';
  document.getElementById('app-screen').style.display = 'block';
  const initials = user.name.split(' ').map(w => w[0]).join('').toUpperCase().slice(0,2);
  document.getElementById('user-avatar').textContent = initials;
  document.getElementById('user-name-chip').textContent = user.name.split(' ')[0];
  loadTasks();
}

function loadTasks() {
  const all = JSON.parse(localStorage.getItem(TASKS_KEY) || '[]');
  allTasks = all.filter(t => t.owner === currentUser.email);
  renderAll();
}

function saveTasks() {
  const all = JSON.parse(localStorage.getItem(TASKS_KEY) || '[]');
  const others = all.filter(t => t.owner !== currentUser.email);
  localStorage.setItem(TASKS_KEY, JSON.stringify([...others, ...allTasks]));
}

// ══════════════════════════════════════
//  FILTER & SEARCH
// ══════════════════════════════════════
function setFilter(mode, btn) {
  filterMode = mode;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderAll();
}

function getFiltered() {
  const q = (document.getElementById('search-input')?.value || '').toLowerCase();
  return allTasks.filter(t => {
    const matchStatus = filterMode === 'all' || t.status === filterMode;
    const matchSearch = !q || t.title.toLowerCase().includes(q) || (t.desc||'').toLowerCase().includes(q);
    return matchStatus && matchSearch;
  });
}

// ══════════════════════════════════════
//  VIEWS
// ══════════════════════════════════════
function setView(v) {
  viewMode = v;
  document.getElementById('board-view').style.display = v === 'board' ? 'block' : 'none';
  document.getElementById('list-view').style.display  = v === 'list'  ? 'block' : 'none';
  document.getElementById('board-btn').classList.toggle('active', v === 'board');
  document.getElementById('list-btn').classList.toggle('active', v === 'list');
  renderAll();
}

// ══════════════════════════════════════
//  RENDER
// ══════════════════════════════════════
function renderAll() {
  updateStats();
  const tasks = getFiltered();
  viewMode === 'board' ? renderBoard(tasks) : renderList(tasks);
}

function updateStats() {
  const total    = allTasks.length;
  const progress = allTasks.filter(t => t.status === 'in-progress').length;
  const done     = allTasks.filter(t => t.status === 'done').length;
  const today    = new Date().toISOString().split('T')[0];
  const overdue  = allTasks.filter(t => t.due && t.due < today && t.status !== 'done').length;
  const pct      = total ? Math.round((done / total) * 100) : 0;
  document.getElementById('stat-total').textContent    = total;
  document.getElementById('stat-progress').textContent = progress;
  document.getElementById('stat-done').textContent     = done;
  document.getElementById('stat-overdue').textContent  = overdue;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-pct').textContent  = pct + '%';
}

function renderBoard(tasks) {
  const cols = { 'todo': [], 'in-progress': [], 'done': [] };
  tasks.forEach(t => (cols[t.status] || cols['todo']).push(t));
  renderCol('todo',        cols['todo']);
  renderCol('in-progress', cols['in-progress']);
  renderCol('done',        cols['done']);
}

function renderCol(status, tasks) {
  const keyMap = { 'todo': 'todo', 'in-progress': 'progress', 'done': 'done' };
  const k = keyMap[status];
  document.getElementById('count-' + k).textContent = tasks.length;
  const body = document.getElementById('cards-' + k);
  body.innerHTML = '';
  if (!tasks.length) {
    body.innerHTML = `<div class="empty-col"><div class="empty-icon">${status === 'done' ? '✓' : '○'}</div>No tasks here</div>`;
    return;
  }
  tasks.forEach(t => { body.appendChild(makeCard(t)); });
}

function makeCard(t) {
  const today = new Date().toISOString().split('T')[0];
  const isOverdue = t.due && t.due < today && t.status !== 'done';
  const prioColor = { high: 'var(--red)', medium: 'var(--orange)', low: 'var(--blue)' }[t.priority] || 'var(--text-dim)';

  const card = document.createElement('div');
  card.className = 'task-card';
  card.style.setProperty('--priority-color', prioColor);
  card.innerHTML = `
    <div class="task-actions">
      <div class="icon-btn edit" onclick="editTask('${t.id}',event)" title="Edit">✎</div>
      <div class="icon-btn delete" onclick="deleteTask('${t.id}',event)" title="Delete">✕</div>
    </div>
    <div class="task-title">${esc(t.title)}</div>
    ${t.desc ? `<div class="task-desc">${esc(t.desc)}</div>` : ''}
    <div class="task-meta">
      <span class="tag tag-priority-${t.priority}">${t.priority}</span>
      ${t.category ? `<span class="tag" style="background:var(--surface3);color:var(--text-muted)">${esc(t.category)}</span>` : ''}
      ${t.due ? `<span class="task-due ${isOverdue ? 'overdue' : ''}">${isOverdue ? '⚠ ' : ''}${formatDate(t.due)}</span>` : ''}
    </div>
  `;
  card.addEventListener('click', () => editTask(t.id));
  return card;
}

function renderList(tasks) {
  const container = document.getElementById('list-container');
  container.innerHTML = '';
  if (!tasks.length) {
    container.innerHTML = `<div class="empty-col" style="padding:48px 0;text-align:center"><div class="empty-icon" style="font-size:36px">○</div>No tasks found</div>`;
    return;
  }
  tasks.forEach(t => {
    const today = new Date().toISOString().split('T')[0];
    const isOverdue = t.due && t.due < today && t.status !== 'done';
    const isDone = t.status === 'done';
    const badgeClass = { 'todo': 'badge-todo', 'in-progress': 'badge-progress', 'done': 'badge-done' }[t.status];
    const badgeLabel = { 'todo': 'To Do', 'in-progress': 'In Progress', 'done': 'Done' }[t.status];
    const row = document.createElement('div');
    row.className = 'task-row';
    row.innerHTML = `
      <div class="task-row-check ${isDone ? 'done' : ''}" onclick="toggleDone('${t.id}',event)">${isDone ? '✓' : ''}</div>
      <div class="task-row-title ${isDone ? 'done-text' : ''}">${esc(t.title)}</div>
      ${t.due ? `<span style="font-family:'DM Mono',monospace;font-size:11px;color:${isOverdue ? 'var(--red)' : 'var(--text-dim)'}">${isOverdue ? '⚠ ' : ''}${formatDate(t.due)}</span>` : ''}
      <span class="task-row-badge ${badgeClass}">${badgeLabel}</span>
      <div class="task-row-actions">
        <div class="icon-btn edit" onclick="editTask('${t.id}',event)" title="Edit">✎</div>
        <div class="icon-btn delete" onclick="deleteTask('${t.id}',event)" title="Delete">✕</div>
      </div>
    `;
    row.addEventListener('click', () => editTask(t.id));
    container.appendChild(row);
  });
}

// ══════════════════════════════════════
//  CRUD
// ══════════════════════════════════════
function openModal(taskId) {
  editingId = taskId || null;
  const modal = document.getElementById('modal-overlay');
  document.getElementById('modal-title').textContent = taskId ? 'Edit Task' : 'New Task';
  if (taskId) {
    const t = allTasks.find(x => x.id === taskId);
    document.getElementById('task-title').value    = t.title;
    document.getElementById('task-desc').value     = t.desc || '';
    document.getElementById('task-status').value   = t.status;
    document.getElementById('task-priority').value = t.priority;
    document.getElementById('task-category').value = t.category || 'General';
    document.getElementById('task-due').value      = t.due || '';
  } else {
    document.getElementById('task-title').value    = '';
    document.getElementById('task-desc').value     = '';
    document.getElementById('task-status').value   = 'todo';
    document.getElementById('task-priority').value = 'medium';
    document.getElementById('task-category').value = 'General';
    document.getElementById('task-due').value      = '';
  }
  modal.classList.add('open');
  setTimeout(() => document.getElementById('task-title').focus(), 100);
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
  editingId = null;
}

function handleOverlayClick(e) {
  if (e.target === document.getElementById('modal-overlay')) closeModal();
}

function saveTask() {
  const title = document.getElementById('task-title').value.trim();
  if (!title) { showToast('Title is required', '⚠️'); return; }
  if (editingId) {
    const idx = allTasks.findIndex(t => t.id === editingId);
    allTasks[idx] = {
      ...allTasks[idx],
      title,
      desc:     document.getElementById('task-desc').value.trim(),
      status:   document.getElementById('task-status').value,
      priority: document.getElementById('task-priority').value,
      category: document.getElementById('task-category').value,
      due:      document.getElementById('task-due').value,
      updated:  Date.now(),
    };
    showToast('Task updated', '✏️');
  } else {
    allTasks.unshift({
      id:       uid(),
      title,
      desc:     document.getElementById('task-desc').value.trim(),
      status:   document.getElementById('task-status').value,
      priority: document.getElementById('task-priority').value,
      category: document.getElementById('task-category').value,
      due:      document.getElementById('task-due').value,
      owner:    currentUser.email,
      created:  Date.now(),
    });
    showToast('Task created', '✅');
  }
  saveTasks(); closeModal(); renderAll();
}

function editTask(id, e) {
  if (e) e.stopPropagation();
  openModal(id);
}

function deleteTask(id, e) {
  if (e) e.stopPropagation();
  if (!confirm('Delete this task?')) return;
  allTasks = allTasks.filter(t => t.id !== id);
  saveTasks(); renderAll();
  showToast('Task deleted', '🗑️');
}

function toggleDone(id, e) {
  e.stopPropagation();
  const t = allTasks.find(x => x.id === id);
  if (!t) return;
  t.status = t.status === 'done' ? 'todo' : 'done';
  saveTasks(); renderAll();
  showToast(t.status === 'done' ? 'Marked complete' : 'Marked incomplete', t.status === 'done' ? '✅' : '○');
}

// ══════════════════════════════════════
//  UTILS
// ══════════════════════════════════════
function esc(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function formatDate(str) {
  const d = new Date(str + 'T00:00:00');
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}

function showToast(msg, icon) {
  const wrap = document.getElementById('toast-wrap');
  const el   = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = `<span>${icon}</span><span>${msg}</span>`;
  wrap.appendChild(el);
  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 350); }, 2800);
}

// Keyboard shortcut: N = new task
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeModal(); }
  if ((e.key === 'n' || e.key === 'N') && !['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)) {
    openModal();
  }
});
</script>
